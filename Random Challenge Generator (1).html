load(){setTimeout(()=>view==="load"&&go(me?"dash":"welcome"),1800);return `<div class="load"><div><div style="font-weight:900;letter-spacing:.2em">🎯 CHALLENGE GENERATOR</div><h1>READY FOR A CHALLENGE?</h1><p style="font-size:1.2rem">Test your knowledge. Build your skills. Beat your score.</p><div aria-hidden="true">${["#facc15","#f97316","#ec4899","#16a34a","#14123a"].map((c,i)=>`<span class="sq" style="background:${c};animation-delay:${i*.15}s"></span>`).join("")}</div><p>Loading…</p></div></div>`},
welcome(){return `<main><div class="blk" style="background:linear-gradient(135deg,#7c3aed,#2563eb)"><div style="font-size:5rem" aria-hidden="true">🎲💻🧠🏃🌍</div><h1>RANDOM CHALLENGE GENERATOR</h1><p style="font-size:1.4rem;font-weight:700">A new challenge every time.</p><p>Pick a category, climb 3 levels, answer 5 random questions each, and earn points, streaks and badges.</p><div class="row" style="justify-content:flex-start"><button class="alt" data-act="start">Start Challenge</button><button data-go="auth" data-mode="login">Login</button><button class="ghost" style="color:#fff" data-go="auth" data-mode="signup">Sign Up</button></div></div><div class="grid">${[["🔀","Different Every Time","#f97316"],["📈","Track Your Progress","#16a34a"],["⭐","Build Your Score","#ec4899"],["💪","Challenge Yourself","#7c3aed"]].map(([e,t,c])=>`<div class="card" style="border-top:10px solid ${c}"><div style="font-size:2.4rem" aria-hidden="true">${e}</div><h3>${t}</h3></div>`).join("")}</div></main>`},
auth(){const su=ctx.mode==="signup";const m=ctx.msg;ctx.msg="";return `<main style="max-width:520px"><div class="card"><h2>${su?"CREATE ACCOUNT":"LOGIN"}</h2>${m?`<p class="err" role="alert">${esc(m)}</p>`:""}<form id="af" novalidate>
<label for="u">${su?"Username":"Username or Email"}</label><input id="u" autocomplete="username" autofocus>${su?`<label for="e">Email</label><input id="e" type="email" autocomplete="email">`:""}
<label for="p">Password</label><input id="p" type="password" autocomplete="${su?"new-password":"current-password"}">${su?`<label for="p2">Confirm Password</label><input id="p2" type="password" autocomplete="new-password">`:""}
<label><input type="checkbox" id="sh" style="width:auto;margin-right:8px">Show password</label><p class="err" id="er" role="alert"></p>
<div class="row"><button type="submit" id="sb">${su?"Create Account":"Login"}</button><button type="button" class="ghost" data-mode="${su?"login":"signup"}">${su?"I have an account":"Create Account"}</button></div>${su?"":`<button type="button" class="ghost" data-act="forgot">Forgot Password</button>`}</form></div><div class="row"><button class="ghost" data-go="welcome">← Back</button></div></main>`},
dash(){const k=day(),t=forDay(k),ds=t.reduce((a,h)=>a+h.score,0),lv=Math.max(1,Math.floor(total()/50)+1),nb=Object.keys(U().d.badges).length;
const cards=[["Daily Score",ds,"#f97316"],["Total Score",total(),"#7c3aed"],["Completed Challenges",U().d.hist.filter(h=>h.completed).length,"#16a34a"],["Current Level",lv,"#2563eb"],["Current Streak",streak()+" 🔥","#ec4899"],["Badges Earned",nb+" / "+BADGES.length,"#ca8a04"]];
return `<main><h1>Welcome, ${esc(me)}!</h1><div class="grid">${cards.map(([l,v,c])=>`<div class="blk" style="background:${c};margin:0"><div>${l}</div><div class="stat" data-count="${parseInt(v)}">${v}</div></div>`).join("")}</div><div class="row"><button class="alt" data-go="cats">Start a Challenge →</button><button data-go="daily">Daily Score</button></div></main>`},
cats(){return `<main><h2>CATEGORIES</h2><div class="grid">${CATS.map(c=>{const n=c.t.reduce((a,t)=>a+trkProg(t),0),max=c.t.length*3;return `<button class="tile" style="background:${c.c}" data-cat="${c.id}"><span class="em" aria-hidden="true">${c.em}</span><h3>${c.n}</h3><span>"${c.d}"</span><span>${n} / ${max} levels completed</span>${bar(Math.round(n/max*100))}<b>Start →</b></button>`}).join("")}</div>${pager("dash","daily")}</main>`},
subs(){const c=CATS.find(x=>x.id===ctx.cat)||CATS[0];return `<main><h2>${c.n}</h2><div class="grid">${c.t.map(t=>{const T=TR[t],p=trkProg(t);return `<button class="tile" style="background:${T.c}" data-trk="${t}"><span class="em" aria-hidden="true">${T.em}</span><h3>${T.n.toUpperCase()}</h3><span>"${T.d}"</span><span>${p===3?"All levels complete":"Level "+(p+1)+" available"}</span>${bar(Math.round(p/3*100))}<b>Start →</b></button>`}).join("")}</div>${pager("cats","daily")}</main>`},
levels(){const t=ctx.trk,T=TR[t];if(!T){return V.cats()}const names=["Beginner","Intermediate","Advanced"];
return `<main><div class="blk" style="background:${T.c}"><span style="font-size:3rem" aria-hidden="true">${T.em}</span><h2>${T.n.toUpperCase()}</h2></div><div class="grid">${[1,2,3].map(l=>{const ok=unlocked(t,l),d=done(t,l);return `<div class="card"><h3>LEVEL ${l}</h3><div aria-label="${l} of 3 stars">${"★".repeat(l)}${"☆".repeat(3-l)}</div><p>${names[l-1]} · 5 Questions</p><p><b>${d?"✔ Completed · best "+U().d.prog[t][l].best+"/50":ok?"Ready":"🔒 LOCKED until Level "+(l-1)+" is completed"}</b></p><button data-lvl="${l}" ${ok?"":"disabled"}>${d?"Play again":"Start"}</button></div>`}).join("")}</div>${pager(TR[t].cat==="coding"?"subs":"cats","daily")}</main>`},
quiz(){const q=ctx.qs[ctx.i],T=TR[ctx.trk],a=ctx.ans;if(!q)return V.cats();const L="ABCD";
return `<main><div class="blk" style="background:${T.c}"><div class="row" style="margin:0"><b>QUESTION ${ctx.i+1} / 5</b><b>${T.n} · Level ${ctx.lvl}</b><b>Level Score ${ctx.score}/50</b></div>${bar((ctx.i+(a!=null?1:0))*20)}</div><div class="card"><div style="font-size:4rem;text-align:center" aria-hidden="true">${T.em}</div><h2 id="qt">${esc(q.t)}</h2><div role="group" aria-labelledby="qt">${q.o.map((o,j)=>{let cl="",mk="";if(a!=null){if(j===q.c){cl="ok";mk=" ✔ Correct"}else if(j===a){cl="no";mk=" ✘ Incorrect"}}return `<button class="opt ${cl}" data-opt="${j}" ${a!=null?"disabled":""}>${L[j]}. ${esc(o)}${mk}</button>`}).join("")}</div>
${a!=null?`<div role="status"><h3>${a===q.c?"✔ Correct! +10":"✘ Incorrect +0"}</h3><p><b>Correct Answer:</b> ${L[q.c]}. ${esc(q.o[q.c])}</p><p><b>Explanation:</b> ${esc(q.e)}</p><button data-act="next" autofocus>${ctx.i===4?"Complete Level →":"Next Question →"}</button></div>`:""}</div><div class="row"><button class="ghost" data-act="quit">← Back to Levels</button><span>Daily ${forDay(day()).reduce((x,h)=>x+h.score,0)} · Total ${total()}</span></div></main>`},
result(){const r=ctx.res,T=TR[ctx.trk],all=[1,2,3].every(l=>done(ctx.trk,l));
return `<main><div class="blk" style="background:linear-gradient(135deg,${T.c},#14123a)"><h1>${all?"ALL LEVELS COMPLETE!":"LEVEL COMPLETE!"}</h1><div class="stat">Score: ${r.score} / 50</div><p>Correct: ${r.ok} / 5 · Incorrect: ${5-r.ok} · Accuracy: ${r.ok*20}%<br>Time: ${r.time}s · Streak: ${streak()} 🔥</p>${r.nl?`<p><b>${r.nl}</b></p>`:""}${r.nb.length?`<p class="badge new">🏅 New badge: ${r.nb.map(esc).join(", ")}</p>`:""}</div>
${ctx.view?`<div class="card">${r.log.map((x,i)=>`<p><b>${i+1}. ${esc(x.t)}</b><br>${x.right?"✔":"✘"} Your answer: ${esc(x.mine)}<br>Correct: ${esc(x.cor)} — ${esc(x.e)}</p>`).join("")}</div>`:""}
<div class="row"><button class="ghost" data-act="viewans">View Answers</button>${ctx.lvl<3?`<button data-act="nextlvl">Next Level</button>`:""}<button class="alt" data-go="cats">Back to Categories</button></div></main>`},
daily(){const k=day(),t=forDay(k),s=t.reduce((a,h)=>a+h.score,0),c=t.reduce((a,h)=>a+h.ok,0);const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([d.toLocaleDateString(undefined,{weekday:"short"}).toUpperCase(),forDay(day(d)).reduce((a,h)=>a+h.score,0)])}const mx=Math.max(50,...days.map(x=>x[1]));
return `<main><div class="blk" style="background:#f97316"><h2>TODAY'S SCORE</h2><div class="stat" style="font-size:5rem">${s}</div><p>Questions: ${t.length*5} · Correct: ${c} · Accuracy: ${t.length?Math.round(c/(t.length*5)*100):0}% · Challenges: ${t.length} · Streak: ${streak()} 🔥</p></div><div class="card"><h3>This week</h3><div class="chart">${days.map(([l,v])=>`<div><span>${v}</span><b style="height:${v/mx*120}px"></b>${l}</div>`).join("")}</div></div>${pager("cats","hist")}</main>`},
hist(){const h=[...U().d.hist].reverse();return `<main><h2>HISTORY</h2>${h.length?`<div class="grid">${h.map((x,i)=>`<button class="card opt" data-h="${h.length-1-i}" style="min-height:auto"><b>${new Date(x.at).toLocaleDateString(undefined,{dateStyle:"long"})}</b><br>${esc(x.trk)} · Level ${x.lvl}<br>${x.score}/50 · ${x.ok}/5 · ${x.ok*20}% · ${x.completed?"Completed":"In progress"}</button>`).join("")}</div>`:`<div class="card"><h3>No history yet</h3><p>Complete a challenge and it will show up here.</p><button data-go="cats">Start a Challenge</button></div>`}${pager("daily","prev")}</main>`},
detail(){const x=U().d.hist[ctx.h];if(!x)return V.hist();return `<main><div class="card"><h2>${esc(x.trk)} · Level ${x.lvl}</h2><p>${new Date(x.at).toLocaleString()}<br>Score ${x.score}/50 · Correct ${x.ok}/5 · Accuracy ${x.ok*20}% · Time ${x.time}s</p>${(x.log||[]).map((l,i)=>`<p><b>${i+1}. ${esc(l.t)}</b><br>${l.right?"✔":"✘"} ${esc(l.mine)} (correct: ${esc(l.cor)})</p>`).join("")}</div><div class="row"><button class="ghost" data-go="hist">← Back to History</button></div></main>`},
prev(){const d=new Date();d.setDate(d.getDate()-(ctx.off||1));const t=forDay(day(d)),s=t.reduce((a,h)=>a+h.score,0),c=t.reduce((a,h)=>a+h.ok,0),off=ctx.off||1;
return `<main><h2>PREVIOUS DAYS</h2><div class="blk" style="background:#2563eb"><h3>${off===1?"Yesterday · ":""}${d.toLocaleDateString(undefined,{dateStyle:"long"})}</h3>${t.length?`<p class="stat">${s}</p><p>Challenges: ${t.length} · Accuracy: ${Math.round(c/(t.length*5)*100)}%</p>`:`<p>No data for this day.</p>`}</div><div class="row"><button class="ghost" data-act="pd" data-d="1">← Previous Day</button><button data-act="pd" data-d="-1" ${off<=1?"disabled":""}>Next Day →</button></div>${pager("hist","badges")}</main>`},
badges(){const b=U().d.badges;return `<main><h2>BADGES</h2><div class="grid">${BADGES.map(([id,n,d,e])=>`<div class="card badge ${b[id]?"":"lock"}"><div class="em" aria-hidden="true">${e}</div><h3>${n}</h3><p>${d}</p><b>${b[id]?"Unlocked":"🔒 Locked"}</b></div>`).join("")}</div>${pager("prev","reset")}</main>`},
reset(){return `<main><div class="card"><h2>RESET PROGRESS</h2><p>Remove your active level progress and badges. Your past history is kept.</p><button class="red" data-act="askreset">RESET PROGRESS</button></div>${pager("badges")}</main>`},
about(){return `<main><div class="card"><h2>About</h2><p>Random Challenge Generator serves a fresh set of random questions each time you play.</p></div><div class="row"><button class="ghost" data-act="back">← Back</button></div></main>`},
privacy(){return `<main><div class="card"><h2>Privacy</h2><p>Accounts and progress are stored in this browser only. Passwords are salted and hashed, never saved as plain text.</p></div><div class="row"><button class="ghost" data-act="back">← Back</button></div></main>`},
contact(){return `<main><div class="card"><h2>Contact</h2><p>Questions or feedback? Use the Comments on this page.</p></div><div class="row"><button class="ghost" data-act="back">← Back</button></div></main>`}};
V.subs.title="";
// ---------- game logic ----------
function startLevel(t,l){if(!unlocked(t,l)){alert("This level is locked.");return go("levels",{trk:t})}
const pool=Q[t]?.[l-1];if(!pool||pool.length<5){return alert("Questions unavailable for this level.")}
const used=new Set(),qs=[];while(qs.length<5){const i=Math.floor(Math.random()*pool.length);if(used.has(i))continue;used.add(i);const p=pool[i],ord=[0,1,2,3].sort(()=>Math.random()-.5);qs.push({t:p[0],o:ord.map(j=>p[1][j]),c:ord.indexOf(p[2]),e:p[3]})}
ctx={...ctx,trk:t,lvl:l,qs,i:0,ans:null,score:0,ok:0,log:[],t0:Date.now(),finished:false,view:false};go("quiz")}
function finish(){const t=ctx.trk,l=ctx.lvl,d=U().d,time=Math.round((Date.now()-ctx.t0)/1000);ctx.finished=true;
const first=!d.prog[t]?.[l];d.prog[t]=d.prog[t]||{};const prev=d.prog[t][l]?.best||0;d.prog[t][l]={best:Math.max(prev,ctx.score)};
d.hist.push({at:Date.now(),day:day(),trk:TR[t].n,t,lvl:l,score:ctx.score,ok:ctx.ok,time,completed:true,log:ctx.log});
const nb=[],give=(id)=>{if(!d.badges[id]){d.badges[id]=Date.now();nb.push(BADGES.find(b=>b[0]===id)[1])}};
give("first");give("master");if(ctx.ok===5)give("perfect");const cat=TR[t].cat;
if(cat==="coding")give("hero");if(cat!=="coding")give(cat);if(streak()>=7)give("streak");
if(CATS.every(c=>c.t.some(x=>trkProg(x)>0)))give("all");save();
ctx.res={score:ctx.score,ok:ctx.ok,time,log:ctx.log,nb,nl:l<3?"Level "+(l+1)+" unlocked!":""};go("result")}
// ---------- events ----------
app.addEventListener("click",async e=>{const el=e.target.closest("button,a,[data-go]");if(!el)return;const D=el.dataset;
if(D.mode){ctx.mode=D.mode}
if(D.go){if(D.go==="auth"&&D.mode)ctx.mode=D.mode;return leave(D.go)}
if(D.cat){ctx.cat=D.cat;const c=CATS.find(x=>x.id===D.cat);return c.t.length>1?go("subs"):go("levels",{trk:c.t[0]})}
if(D.trk)return go("levels",{trk:D.trk});if(D.lvl)return startLevel(ctx.trk,+D.lvl);
if(D.h!=null)return go("detail",{h:+D.h});
if(D.opt!=null&&ctx.ans==null){const j=+D.opt,q=ctx.qs[ctx.i],right=j===q.c;ctx.ans=j;if(right){ctx.score+=10;ctx.ok++}ctx.log.push({t:q.t,right,mine:q.o[j],cor:q.o[q.c],e:q.e});return render()}
if(D.mode&&view==="auth")return go("auth");
switch(D.act){case"start":return go(me?"cats":"auth",{mode:"signup"});
case"out":me=null;S.session=null;save();return go("welcome");
case"next":ctx.i++;ctx.ans=null;return ctx.i>4?finish():render();
case"quit":return leave("levels");case"viewans":ctx.view=true;return render();
case"nextlvl":return startLevel(ctx.trk,ctx.lvl+1);
case"pd":ctx.off=Math.max(1,(ctx.off||1)+ +D.d);return render();
case"back":return go(me?"dash":"welcome");
case"forgot":return alert("Password reset by email needs a server. For now, create a new account with a different username.");
case"askreset":{const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.innerHTML=`<div class="card"><h2>Are you sure you want to reset your progress?</h2><p>This will remove your current progress and scores.</p><div class="row"><button class="ghost" id="c">Cancel</button><button class="red" id="r">Reset Progress</button></div></div>`;document.body.appendChild(m);m.querySelector("#c").focus();m.querySelector("#c").onclick=()=>m.remove();m.querySelector("#r").onclick=()=>{const d=U().d;d.archive.push({at:Date.now(),hist:d.hist});d.prog={};d.badges={};d.hist=d.hist.map(h=>({...h}));save();m.remove();go("dash")};}}
});
app.addEventListener("change",e=>{if(e.target.id==="sh")app.querySelectorAll("input[type=password]").forEach(i=>i.type=e.target.checked?"text":"password")});
app.addEventListener("submit",async e=>{e.preventDefault();const g=i=>(app.querySelector("#"+i)?.value||"").trim(),er=app.querySelector("#er"),b=app.querySelector("#sb"),su=ctx.mode==="signup";
const u=g("u"),p=app.querySelector("#p").value,fail=m=>{er.textContent=m};
if(!u||!p)return fail("Please fill in all fields.");b.disabled=true;b.textContent="Please wait…";
try{if(su){const em=g("e"),p2=app.querySelector("#p2").value;
if(!/^[\w.-]{3,20}$/.test(u)){b.disabled=false;b.textContent="Create Account";return fail("Username: 3–20 letters, numbers, . _ -")}
if(!/^\S+@\S+\.\S+$/.test(em)){b.disabled=false;b.textContent="Create Account";return fail("Enter a valid email.")}
if(p.length<8){b.disabled=false;b.textContent="Create Account";return fail("Password must be at least 8 characters.")}
if(p!==p2){b.disabled=false;b.textContent="Create Account";return fail("Passwords do not match.")}
if(Object.keys(S.users).some(k=>k.toLowerCase()===u.toLowerCase())){b.disabled=false;b.textContent="Create Account";return fail("Username already exists.")}
const salt=crypto.randomUUID();S.users[u]={email:em,salt,hash:await hash(p,salt),created:Date.now(),d:blank()};me=u;S.session=u;save();go("dash")}
else{const k=Object.keys(S.users).find(k=>k.toLowerCase()===u.toLowerCase()||S.users[k].email.toLowerCase()===u.toLowerCase());
if(!k){b.disabled=false;b.textContent="Login";return fail("Invalid login: account not found.")}
if(await hash(p,S.users[k].salt)!==S.users[k].hash){b.disabled=false;b.textContent="Login";return fail("Incorrect password.")}
me=k;S.session=k;save();go("dash")}}catch{b.disabled=false;fail("Something went wrong. Please try again.")}});
window.addEventListener("beforeunload",e=>{if(view==="quiz"&&!ctx.finished){e.preventDefault();e.returnValue=""}});
if(S.session&&S.users[S.session])me=S.session;render();
</script></body></html>
